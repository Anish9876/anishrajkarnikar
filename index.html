<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>SOON</title>
  <style>
    /* Force dark color scheme and dark visuals */
    :root { color-scheme: dark; }
    html,body { height: 100%; margin: 0; }

    body{
      background: linear-gradient(180deg, #000000 0%, #0a0a0a 100%);
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      display: grid;
      place-items: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      text-rendering: optimizeLegibility;
    }

    /* Large centered "SOON" */
    .soon {
      font-weight: 800;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
      font-size: clamp(3.5rem, 20vw, 18rem);
      line-height: 0.9;
      padding: 0 1rem;
      text-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.02) inset;
    }

    /* Small accessibility hint (hidden visually but available to screen readers) */
    .sr-only {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }

    /* Make sure nothing forces a light theme (override user-agent) */
    @media (prefers-color-scheme: light) {
      body { background: linear-gradient(180deg, #000000 0%, #0a0a0a 100%); color: #fff; }
    }
  </style>
</head>
<body>
  <h2 class="soon">WROK IN Progress</h2>
  <span class="sr-only">Site coming soon. Dark mode only.</span>
</body>
</html>
